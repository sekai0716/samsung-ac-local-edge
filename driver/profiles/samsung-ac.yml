name: samsung-ac
components:
  - id: main
    label: 에어컨
    capabilities:
      - id: switch
        version: 1
      - id: airConditionerMode
        version: 1
      - id: thermostatCoolingSetpoint
        version: 1
      - id: airConditionerFanMode
        version: 1
      - id: temperatureMeasurement
        version: 1
      - id: relativeHumidityMeasurement
        version: 1
      - id: refresh
        version: 1
      - {id: dustSensor, version: 1}
      - {id: veryFineDustSensor, version: 1}
      - {id: odorSensor, version: 1}
      - {id: airQualityHealthConcern, version: 1}
      - {id: instantcommon43059.samsungAcLocalTimer, version: 1}
      - {id: instantcommon43059.samsungAcLocalNativeTimer, version: 1}
      - {id: instantcommon43059.samsungAcLocalSettings, version: 1}
      - {id: instantcommon43059.samsungAcLocalComfort, version: 1}
      - {id: instantcommon43059.samsungAcLocalDeviceSettings, version: 1}
      - {id: instantcommon43059.samsungAcLocalCare, version: 1}
      - {id: instantcommon43059.samsungAcLocalOperation, version: 1}
      - {id: instantcommon43059.samsungAcLocalTemperature, version: 1}
      - {id: instantcommon43059.samsungAcLocalAirFeatures, version: 1}
      - {id: instantcommon43059.samsungAcLocalDisplay, version: 1}
      - {id: instantcommon43059.samsungAcLocalPanel, version: 1}
      - {id: instantcommon43059.samsungAcLocalOperating, version: 1}
    categories:
      - name: AirConditioner
  - id: windfree
    label: 무풍 (냉방·제습·청정에서 설정)
    capabilities:
      - id: switch
        version: 1
  - id: autoclean
    label: 자동건조 사용 설정
    capabilities:
      - id: switch
        version: 1
  - id: purify
    label: 청정 (냉방·제습에서 On/Off)
    capabilities:
      - id: switch
        version: 1
  - id: doorupper
    label: 상단 바람문
    capabilities:
      - {id: switch, version: 1}
  - id: doorlower
    label: 하단 바람문
    capabilities:
      - {id: switch, version: 1}
  - id: panel
    label: 바람문(패널) 열림
    capabilities:
      - {id: doorControl, version: 1}
  - id: speed
    label: 스피드 (냉방에서 설정)
    capabilities:
      - {id: switch, version: 1}
  - id: quiet
    label: 정음 (냉방에서 설정)
    capabilities:
      - {id: switch, version: 1}
  - id: displayoff
    label: 화면 끄기
    capabilities:
      - {id: switch, version: 1}
metadata:
  ocfDeviceType: oic.d.airconditioner
  # 화면 조회에는 ID와 제조사 쌍을 사용합니다. 구성·번역 변경 시 두 값을 함께 갱신합니다.
  # 본체 예약 화면 등록이 403으로 실패해 기존 vid를 유지합니다. 새 화면 생성 전에는 배포하지 않습니다.
  vid: 490c4f1e-8fd9-37c7-940f-d7131ae739a0
  mnmn: SmartThingsCommunity
preferences:
  - name: targetIp
    title: 에어컨 IP
    description: 비워 두면 자동 검색한 주소를 사용합니다. 등록된 기기의 주소를 직접 지정할 때 입력합니다.
    required: false
    preferenceType: string
    definition:
      stringType: text
      default: ""
  - name: enablePolling
    title: 주기 조회
    description: 꺼도 초기 조회와 수동 새로고침은 동작합니다.
    required: true
    preferenceType: boolean
    definition:
      default: true
  - name: refreshSeconds
    title: 조회 간격(초)
    required: true
    preferenceType: integer
    definition:
      minimum: 5
      maximum: 900
      default: 10
